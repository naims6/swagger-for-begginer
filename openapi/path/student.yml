register:
  summary: Register a new student
  tags:
    - Students
  security:
    - bearerAuth: []  
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              example:
            password:
              type: string
              example: password123
  responses:
    "201":
      description: Student created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Student created successfully
              data:
                type: object
                properties:
                  id:
                    type: integer
                    example: 123456
                  name:
                    type: string
                    example: Jane Doe
                  email:
                    type: string
                    example:
