openapi: 3.0.0

info:
  title: Rise Together Shop
  version: 1.0.0
  description: This is the API documentation for the Rise Together Shop, an online platform for purchasing products and services.

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.risetogethershop.com
    description: Production server

tags:
  - name: Students
    description: Operations related to students
  - name: Orders
    description: Operations related to orders

paths:
  /students:
    get:
      $ref: "./path/student.yml#/register"
    post:
      summary: Create a new student
      tags:
        - Students
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  example: jane.doe@gmail.com
                  required: true
                password:
                  type: string
                  example: password123
                  required: true
      responses:
        "201":
          description: Student created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Student created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 123456
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        example:
